<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KangBao AutoClick</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="window">

    <header class="topbar">

        <div class="brand">
            <div class="wolf">🐺</div>

            <div>
                <div class="title">
                    KangBao <span>AutoClick</span>
                </div>

                <div class="subtitle">
                    SIMPLE • FAST • CLEAN
                </div>
            </div>
        </div>

        <div class="window-buttons">
            <button id="minimize">−</button>
            <button id="close">×</button>
        </div>

    </header>


    <main>

        <section class="glass status-card">

            <div class="small-title">
                STATUS
            </div>

            <div class="status-row">

                <div id="status-dot" class="status-dot"></div>

                <div id="status-text">
                    READY
                </div>

            </div>

        </section>


        <section class="glass speed-card">

            <div class="section-header">

                <div>
                    <div class="small-title">
                        CLICK SPEED
                    </div>

                    <div class="description">
                        Maximum click rate
                    </div>
                </div>

                <div id="cps">
                    30
                    <span>CPS</span>
                </div>

            </div>


            <input
                id="slider"
                type="range"
                min="1"
                max="30"
                value="30"
            >

            <div class="range-labels">
                <span>1</span>
                <span>15</span>
                <span>30</span>
            </div>

        </section>


        <button id="run" class="run-button">
            <span id="run-icon">▶</span>
            <span id="run-text">RUN</span>
        </button>


        <section class="glass settings">

            <div class="setting">

                <div>
                    <div class="setting-title">
                        GLOBAL HOTKEY
                    </div>

                    <div class="setting-description">
                        Start or stop from anywhere
                    </div>
                </div>

                <div class="key">
                    F6
                </div>

            </div>


            <div class="divider"></div>


            <div class="setting">

                <div>
                    <div class="setting-title">
                        MOUSE BUTTON
                    </div>

                    <div class="setting-description">
                        Button used for clicking
                    </div>
                </div>

                <div class="pill">
                    LEFT
                </div>

            </div>

        </section>

    </main>


    <div class="dock">

        <div class="dock-item active">
            <div class="dock-icon">🐺</div>
            <div class="dock-label">
                KangBao
            </div>
        </div>

        <div class="dock-separator"></div>

        <div class="dock-info">
            AUTOCLICK
        </div>

    </div>

</div>

<script src="renderer.js"></script>

</body>
</html>
