<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KangBao AutoClick</title>
    <link rel="icon" type="image/png" href="iconclick.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(circle at 20% 20%, #8b5cf6 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #6d28d9 0%, transparent 35%),
                #090612;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .glass {
            width: min(700px, 90%);
            padding: 55px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.16);

            border-radius: 32px;

            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .icon {
            width: 110px;
            height: 110px;

            object-fit: contain;

            margin-bottom: 22px;

            filter:
                drop-shadow(0 10px 25px rgba(139, 92, 246, 0.45));
        }

        h1 {
            font-size: 46px;
            letter-spacing: -2px;
            margin-bottom: 12px;
        }

        .subtitle {
            opacity: 0.7;
            font-size: 17px;
            margin-bottom: 35px;
        }

        .download {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 15px 32px;

            border-radius: 16px;

            background: #b88cff;
            color: #160c25;

            font-weight: 700;
            font-size: 17px;

            text-decoration: none;

            transition: 0.2s ease;

            box-shadow:
                0 12px 30px rgba(184, 140, 255, 0.3);
        }

        .download:hover {
            transform: translateY(-3px) scale(1.02);

            box-shadow:
                0 18px 40px rgba(184, 140, 255, 0.45);
        }

        .version {
            margin-top: 22px;
            opacity: 0.5;
            font-size: 14px;
        }

        .dock {
            position: fixed;

            bottom: 24px;
            left: 50%;

            transform: translateX(-50%);

            padding: 10px 16px;

            display: flex;
            gap: 10px;

            border-radius: 22px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .dock span {
            padding: 8px 14px;

            border-radius: 14px;

            font-size: 13px;

            opacity: 0.65;
        }

        @media (max-width: 600px) {

            .glass {
                padding: 40px 25px;
            }

            h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <main class="glass">

        <img
            class="icon"
            src="iconclick.png"
            alt="KangBao AutoClick"
        >

        <h1>KangBao AutoClick</h1>

        <p class="subtitle">
            Fast. Simple. Built by KangBao.
        </p>

        <a
            class="download"
            href="YOUR_GITHUB_RELEASE_ASSET_LINK"
        >
            ↓ Download for Windows
        </a>

        <div class="version">
            Version 1.0.0 · Windows x64
        </div>

    </main>

    <div class="dock">
        <span>🐺 KangBao</span>
        <span>v1.0.0</span>
        <span>Windows</span>
    </div>

</body>
</html>
